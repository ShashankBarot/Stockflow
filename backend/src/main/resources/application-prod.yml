spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # For an existing database, take a backup and explicitly baseline it only
    # after verifying its schema against V1. Blank databases run V1 directly.
    baseline-on-migrate: false
    baseline-version: 1
    baseline-description: existing-stockflow-schema

app:
  bootstrap-admin:
    required: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
